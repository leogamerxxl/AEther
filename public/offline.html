<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Aether - Offline</title>
  <style>
    html,body{height:100%;margin:0}
    body{display:grid;place-items:center;background:#0A0908;color:#F5F2EE;
      font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .wrap{text-align:center;padding:24px;max-width:340px}
    img{width:72px;height:72px;border-radius:18px;margin:0 auto 18px;display:block}
    h1{font-size:18px;font-weight:600;margin:0 0 8px}
    p{font-size:13px;line-height:1.6;color:#6B6460;margin:0}
    .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#C8A165;margin-right:7px;vertical-align:middle}
  </style>
</head>
<body>
  <div class="wrap">
    <img src="/icon-192.png" alt="Aether" />
    <h1><span class="dot"></span>You are offline</h1>
    <p>Aether will reconnect automatically. Your last command view is cached - reopen the app once your connection returns.</p>
  </div>
</body>
</html>
